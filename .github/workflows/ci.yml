name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # edicao.json is generated from workflows/codigo/*.js: it must not drift.
      - run: npm run workflows && git diff --exit-code workflows/

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
