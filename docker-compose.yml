# Everything the newsletter needs locally:
#   docker compose up -d
#   n8n      → http://localhost:5678
#   e-mails  → http://localhost:8026 (Mailpit catches every message; nothing leaves the machine)
# Ports are shifted so it runs next to the other portfolio projects.

x-db: &db
  POSTGRES_USER: sexto
  POSTGRES_PASSWORD: sexto

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *db
      POSTGRES_DB: sexto_homem
    ports: ["5435:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, on an empty volume: n8n's own database + the newsletter tables.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sexto -d sexto_homem"]
      interval: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:2.44.5
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: sexto
      DB_POSTGRESDB_PASSWORD: sexto
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: "false"          # local http only
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Read by the workflows through $env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.6-flash}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      REMETENTE: ${REMETENTE:-Sexto Homem <newsletter@sextohomem.test>}
      ALERTA_EMAIL: ${ALERTA_EMAIL:-alertas@sextohomem.test}
      SEXTO_DATA: ${SEXTO_DATA:-}             # YYYY-MM-DD replays a past morning
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports: ["5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      db: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # web inbox

volumes:
  pg_data:
  n8n_data:
